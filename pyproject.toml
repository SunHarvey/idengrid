[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "idengrid-control"
version = "0.1.0"
description = "IdenGrid control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "argon2-cffi>=23,<26",
  "itsdangerous>=2.2,<3",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "websockets>=15,<16",
  "cryptography>=45,<47",
  "pymysql>=1.1,<2",
]

[dependency-groups]
dev = [
  "aiohttp==3.14.3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[tool.setuptools]
packages = ["cloudbrowser"]

[tool.setuptools.package-data]
cloudbrowser = ["templates/*.html", "static/brand/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = [".", "edge-tunnel"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
